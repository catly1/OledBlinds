plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

task printVersion{
  doLast {
    print android.defaultConfig.versionName + '-' + android.defaultConfig.versionCode
  }
}

// A fresh clone has no keystore, and wiring an empty storeFile into the build breaks every task.
def releaseKeystore = (project.findProperty('keystore') ?: '').toString().trim()

android {
    buildFeatures{
        buildConfig = true
    }
    signingConfigs {
        release {
            if (releaseKeystore) {
                keyAlias project.findProperty('alias')
                keyPassword project.findProperty('keyPass')
                storeFile file(releaseKeystore)
                storePassword project.findProperty('storePass')
            }
        }
    }
    compileSdkVersion 37

    defaultConfig {
        applicationId "com.catly.letterboxer"
        minSdkVersion 26
        targetSdkVersion 37
        versionCode 20
        versionName "6.67"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

// To inline the bytecode built with JVM target 1.8 into
// bytecode that is being built with JVM target 1.6. (e.g. navArgs)


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17" // Or "11", "17". Ensure this is supported.
        // Or remove if you want to use a newer default
        // compatible with your Kotlin plugin.
    }

    namespace 'com.catly.letterboxer'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'


    // Navigation
    implementation "androidx.navigation:navigation-ui-ktx:2.8.7"
    implementation "androidx.navigation:navigation-fragment-ktx:2.8.7"

    implementation "androidx.preference:preference-ktx:1.2.1"


}
